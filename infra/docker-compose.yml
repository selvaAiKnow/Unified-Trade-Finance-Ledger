version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: trade
      POSTGRES_DB: trade_finance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
  api:
    build:
      context: ../api
    ports:
      - "8000:8000"
    environment:
      HOST: host.docker.internal
      MINIO_ENDPOINT: minio:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../api:/app
    depends_on:
      - minio
  sanctions-adapter:
    build:
      context: ../sanctions-adapter
    ports:
      - "8001:8001"
    volumes:
      - ../sanctions-adapter:/app
volumes:
  pgdata:
  miniodata:
