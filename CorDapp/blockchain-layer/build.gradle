plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.24'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

application {
    mainClass = 'com.utfl.blockchainlayer.ApplicationKt'
    // See the `test` task below: corda-rpc's AMQP serializers need these
    // JDK 17 module opens whenever a real CordaRPCConnection is created
    // (i.e. once RealCordaGateway is wired into Application.kt). NOTE: this
    // only affects `./gradlew run` / generated start scripts -- the
    // shadowJar fat jar run via `java -jar` does NOT pick these up
    // automatically and will need them passed explicitly on the command
    // line (or via JDK_JAVA_OPTIONS) wherever it's deployed.
    applicationDefaultJvmArgs = [
        '--add-opens', 'java.base/java.time=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.io=ALL-UNNAMED',
        '--add-opens', 'java.base/java.net=ALL-UNNAMED',
        '--add-opens', 'java.base/java.math=ALL-UNNAMED',
        '--add-opens', 'java.base/java.security.cert=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.security.util=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.security.x509=ALL-UNNAMED'
    ]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://download.corda.net/maven/corda-dependencies' }
    maven { url 'https://download.corda.net/maven/corda-releases' }
}

ext {
    ktor_version = '2.3.12'
}

dependencies {
    implementation "io.ktor:ktor-server-core-jvm:$ktor_version"
    implementation "io.ktor:ktor-server-netty-jvm:$ktor_version"
    implementation "io.ktor:ktor-server-content-negotiation-jvm:$ktor_version"
    implementation "io.ktor:ktor-serialization-kotlinx-json-jvm:$ktor_version"
    implementation "io.ktor:ktor-server-status-pages-jvm:$ktor_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "ch.qos.logback:logback-classic:1.5.6"

    implementation "net.corda:corda-rpc:4.10"
    implementation "com.utfl.tradefinance:contracts:0.1"
    implementation "com.utfl.tradefinance:workflows:0.1"

    testImplementation "io.ktor:ktor-server-test-host-jvm:$ktor_version"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}

test {
    useJUnitPlatform()
    // corda-rpc's AMQP serializers reflectively access JDK-internal classes
    // (e.g. java.time.ZonedDateTime.ofLenient) that JDK 17's module system
    // blocks by default. Needed for any test that actually opens a
    // CordaRPCConnection. See RealCordaGateway smoke-testing notes.
    jvmArgs(
        '--add-opens', 'java.base/java.time=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.io=ALL-UNNAMED',
        '--add-opens', 'java.base/java.net=ALL-UNNAMED',
        '--add-opens', 'java.base/java.math=ALL-UNNAMED',
        '--add-opens', 'java.base/java.security.cert=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.security.util=ALL-UNNAMED',
        '--add-opens', 'java.base/sun.security.x509=ALL-UNNAMED'
    )
}

shadowJar {
    archiveBaseName.set('blockchain-layer')
    archiveClassifier.set('')
    mergeServiceFiles()
}
