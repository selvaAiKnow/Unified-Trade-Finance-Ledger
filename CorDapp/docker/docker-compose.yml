version: "3.8"
services:
  notary:
    build:
      context: ../build/nodes/Notary
      dockerfile: ../../../docker/Dockerfile.corda-node
    container_name: corda-notary
    networks:
      - corda-network

  importer-node:
    build:
      context: ../build/nodes/Importer
      dockerfile: ../../../docker/Dockerfile.corda-node
    container_name: corda-importer
    ports:
      - "10006:10006"
    networks:
      - corda-network
    depends_on:
      - notary

  exporter-node:
    build:
      context: ../build/nodes/Exporter
      dockerfile: ../../../docker/Dockerfile.corda-node
    container_name: corda-exporter
    ports:
      - "10008:10008"
    networks:
      - corda-network
    depends_on:
      - notary

  issuingbank-node:
    build:
      context: ../build/nodes/IssuingBank
      dockerfile: ../../../docker/Dockerfile.corda-node
    container_name: corda-issuingbank
    ports:
      - "10010:10010"
    networks:
      - corda-network
    depends_on:
      - notary

  advisingbank-node:
    build:
      context: ../build/nodes/AdvisingBank
      dockerfile: ../../../docker/Dockerfile.corda-node
    container_name: corda-advisingbank
    ports:
      - "10012:10012"
    networks:
      - corda-network
    depends_on:
      - notary

  bank3-node:
    build:
      context: ../build/nodes/Bank3
      dockerfile: ../../../docker/Dockerfile.corda-node
    container_name: corda-bank3
    ports:
      - "10014:10014"
    networks:
      - corda-network
    depends_on:
      - notary

  bank4-node:
    build:
      context: ../build/nodes/Bank4
      dockerfile: ../../../docker/Dockerfile.corda-node
    container_name: corda-bank4
    ports:
      - "10016:10016"
    networks:
      - corda-network
    depends_on:
      - notary

  blockchain-layer:
    build:
      context: ../blockchain-layer
      dockerfile: Dockerfile
    container_name: blockchain-layer
    ports:
      - "8081:8081"
    environment:
      IMPORTER_RPC_HOST: importer-node
      EXPORTER_RPC_HOST: exporter-node
      ISSUING_BANK_RPC_HOST: issuingbank-node
      ADVISING_BANK_RPC_HOST: advisingbank-node
      BANK3_RPC_HOST: bank3-node
      BANK4_RPC_HOST: bank4-node
      BANK_NAMES: "IssuingBank,AdvisingBank,Bank3,Bank4"
    networks:
      - corda-network
    depends_on:
      - importer-node
      - exporter-node
      - issuingbank-node
      - advisingbank-node
      - bank3-node
      - bank4-node
    # The Corda nodes take ~35s to finish registering and open their RPC
    # ports after their containers start; `depends_on` (without a
    # healthcheck-based condition) only waits for the containers to start,
    # not for RPC to be ready. RpcConnections connects eagerly on startup
    # and exits on failure, so blockchain-layer will crash on its first
    # few attempts before the nodes are ready -- `on-failure` lets Docker
    # restart it (with backoff) until a connection attempt lands after all
    # 6 nodes' RPC endpoints are up.
    restart: on-failure

networks:
  corda-network:
    driver: bridge
