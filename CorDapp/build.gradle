buildscript {
    Properties constants = new Properties()
    file("$projectDir/constants.properties").withInputStream { constants.load(it) }

    ext {
        corda_release_group = constants.getProperty("cordaReleaseGroup")
        corda_core_release_group = constants.getProperty("cordaCoreReleaseGroup")
        corda_release_version = constants.getProperty("cordaVersion")
        corda_core_release_version = constants.getProperty("cordaCoreVersion")
        corda_gradle_plugins_version = constants.getProperty("gradlePluginsVersion")
        kotlin_version = constants.getProperty("kotlinVersion")
        junit_version = constants.getProperty("junitVersion")
        quasar_version = constants.getProperty("quasarVersion")
        log4j_version = constants.getProperty("log4jVersion")
        slf4j_version = constants.getProperty("slf4jVersion")
        corda_platform_version = constants.getProperty("platformVersion").toInteger()
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://download.corda.net/maven/corda-releases' }
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "net.corda.plugins:cordapp:$corda_gradle_plugins_version"
        classpath "net.corda.plugins:quasar-utils:$corda_gradle_plugins_version"
        classpath "net.corda.plugins:cordformation:$corda_gradle_plugins_version"
    }
}

allprojects {
    apply from: "${rootProject.projectDir}/repositories.gradle"
    apply plugin: 'kotlin'

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://download.corda.net/maven/corda-dependencies' }
        maven { url 'https://download.corda.net/maven/corda-releases' }
        maven { url 'https://jitpack.io' }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
        kotlinOptions {
            languageVersion = "1.2"
            apiVersion = "1.2"
            jvmTarget = "1.8"
            javaParameters = true
        }
    }

    jar {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

apply plugin: 'net.corda.plugins.cordformation'

dependencies {
    cordaRuntime "$corda_release_group:corda:$corda_release_version"
    runtimeOnly "$corda_release_group:corda-node-api:$corda_release_version"
    cordapp project(':contracts')
    cordapp project(':workflows')
}

task deployNodes(type: net.corda.plugins.Cordform, dependsOn: ['jar']) {
    directory "./build/nodes"

    node {
        name "O=Notary,L=London,C=GB"
        notary = [validating: true]
        p2pPort 10002
        p2pAddress "corda-notary:10002"
        rpcSettings {
            address "localhost:10003"
            adminAddress "localhost:10023"
        }
        projectCordapp {
            deploy = false
        }
        // A *validating* notary independently re-verifies every transaction's
        // contract code -- including, during backchain resolution, the contract
        // code of ancestor transactions -- so it must have the same CorDapps
        // installed locally as the party nodes. Without these, the notary can
        // notarise a brand-new create-only transaction (e.g. issue-lc, which has
        // no backchain to resolve) but deterministically rejects any transaction
        // that *consumes* an input state with
        // TransactionVerificationException$UntrustedAttachmentsException, because
        // resolving/re-verifying the input's ancestor transaction requires loading
        // the contracts CorDapp attachment, which arrives over P2P and is treated
        // as untrusted when the notary has no local copy to compare it against.
        cordapp project(':contracts')
        cordapp project(':workflows')
    }

    node {
        name "O=Importer,L=Mumbai,C=IN"
        p2pPort 10005
        p2pAddress "corda-importer:10005"
        rpcSettings {
            address "0.0.0.0:10006"
            adminAddress "0.0.0.0:10046"
        }
        rpcUsers = [[user: "importerRpc", password: "importerpass", permissions: ["ALL"]]]
        projectCordapp {
            deploy = false
        }
        cordapp project(':contracts')
        cordapp project(':workflows')
    }

    node {
        name "O=Exporter,L=Mumbai,C=IN"
        p2pPort 10007
        p2pAddress "corda-exporter:10007"
        rpcSettings {
            address "0.0.0.0:10008"
            adminAddress "0.0.0.0:10048"
        }
        rpcUsers = [[user: "exporterRpc", password: "exporterpass", permissions: ["ALL"]]]
        projectCordapp {
            deploy = false
        }
        cordapp project(':contracts')
        cordapp project(':workflows')
    }

    node {
        name "O=IssuingBank,L=Tokyo,C=JP"
        p2pPort 10009
        p2pAddress "corda-issuingbank:10009"
        rpcSettings {
            address "0.0.0.0:10010"
            adminAddress "0.0.0.0:10050"
        }
        rpcUsers = [[user: "issuingBankRpc", password: "issuingbankpass", permissions: ["ALL"]]]
        projectCordapp {
            deploy = false
        }
        cordapp project(':contracts')
        cordapp project(':workflows')
    }

    node {
        name "O=AdvisingBank,L=Mumbai,C=IN"
        p2pPort 10011
        p2pAddress "corda-advisingbank:10011"
        rpcSettings {
            address "0.0.0.0:10012"
            adminAddress "0.0.0.0:10052"
        }
        rpcUsers = [[user: "advisingBankRpc", password: "advisingbankpass", permissions: ["ALL"]]]
        projectCordapp {
            deploy = false
        }
        cordapp project(':contracts')
        cordapp project(':workflows')
    }
}
